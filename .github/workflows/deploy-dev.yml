name: Deploy To Development

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEV_VPS_PATH }}
            if git diff HEAD~1 HEAD --name-only | grep -E "(Dockerfile|docker-compose|\.dockerignore)"; then
              echo "Docker config changed - full rebuild"
              make dev-deploy
            else
              echo "Fast deployment"
              make dev-deploy-fast
            fi
